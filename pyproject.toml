[project]
name = "mixture-compressor-moe"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.5",
    "einops>=0.8.2",
    "gurobipy>=13.0.2",
    "huggingface-hub<1",
    "lm-eval==0.4.5",
    "matplotlib>=3.10.9",
    "numpy==1.26.4",
    "openai==1.30.3",
    "packaging==24.0",
    "pandas==2.2.2",
    "peft<0.12",
    "protobuf>=7.35.0",
    "requests==2.32.2",
    "scikit-learn==1.4.1.post1",
    "scipy==1.13.1",
    "sentencepiece>=0.2.1",
    "termcolor>=3.3.0",
    "texttable>=1.7.0",
    "torch==2.2.1",
    "tqdm>=4.66.3",
    # Bumped from 4.36.x to 4.41.x to match B200 venv. Reason: Mixtral-8x7B-Instruct
    # tokenizer.json uses a PreTokenizer variant that tokenizers 0.15.x (bundled
    # with 4.36) cannot deserialize — fast tokenizer fails with EOF. 4.41 pulls
    # tokenizers 0.19.x which handles the newer format. Existing 8x7B base
    # awareness pkls were generated with 4.36 fast and are kept as-is (drift
    # vs 4.41 fast should be < 0.01 PPL).
    "transformers>=4.41,<4.42",
]

[dependency-groups]
dev = [
    "ninja>=1.13.0",
    "setuptools>=82.0.1",
    "wheel>=0.47.0",
]
